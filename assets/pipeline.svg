<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="McPair 的分工：LLM 只出现在首尾两端">
  <defs>
    <linearGradient id="pg-top" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DA291C"/>
      <stop offset="50%" stop-color="#DA291C"/>
      <stop offset="50%" stop-color="#FFBC0D"/>
      <stop offset="100%" stop-color="#FFBC0D"/>
    </linearGradient>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C9B49F"/>
    </marker>
  </defs>

  <rect width="1200" height="330" fill="#FFF8EE"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#pg-top)"/>

  <text x="48" y="50" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="20" font-weight="800" fill="#DA291C">语言模型只在首尾两端出现</text>
  <text x="48" y="76" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="14" fill="#7C6658">中间所有算术都在确定性代码里完成——模型无法、也不被允许改写任何一个数字。</text>

  <!-- 节点 1 -->
  <rect x="48" y="108" width="196" height="104" rx="12" fill="#FFFFFF" stroke="#F0DCC4" stroke-width="2"/>
  <text x="146" y="142" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13" font-weight="600" fill="#A08D7E" letter-spacing="1">用户</text>
  <text x="146" y="172" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="16" font-weight="700" fill="#2C1B12">「40 以内，不要辣」</text>
  <text x="146" y="194" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" fill="#A08D7E">自然语言</text>

  <line x1="252" y1="160" x2="284" y2="160" stroke="#D8C4AE" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 节点 2 LLM -->
  <rect x="292" y="108" width="180" height="104" rx="12" fill="#FFFFFF" stroke="#DA291C" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="382" y="140" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13" font-weight="800" fill="#DA291C" letter-spacing="1">LLM</text>
  <text x="382" y="168" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="15" font-weight="700" fill="#2C1B12">只做意图理解</text>
  <text x="382" y="192" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#A08D7E">budget / avoid / kcalCap</text>

  <line x1="480" y1="160" x2="512" y2="160" stroke="#D8C4AE" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 节点 3 核心 -->
  <rect x="520" y="96" width="340" height="128" rx="13" fill="#FFF4D2" stroke="#FFBC0D" stroke-width="3"/>
  <text x="690" y="128" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="15" font-weight="800" fill="#B01F14">确定性求解器 · scripts/pair.py</text>
  <text x="690" y="158" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#4A382D">枚举 1881 种组合 → 硬约束剪枝 → 1326 组可行</text>
  <text x="690" y="180" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13" fill="#4A382D">帕累托非支配排序 → 三档选优 → 券最优抵扣</text>
  <text x="690" y="206" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" font-weight="600" fill="#DA291C">零依赖 · 可复现 · 56 个单元测试覆盖</text>

  <line x1="868" y1="160" x2="900" y2="160" stroke="#D8C4AE" stroke-width="2" marker-end="url(#arw)"/>

  <!-- 节点 4 -->
  <rect x="908" y="108" width="196" height="104" rx="12" fill="#FFFFFF" stroke="#DA291C" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1006" y="140" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13" font-weight="800" fill="#DA291C" letter-spacing="1">LLM</text>
  <text x="1006" y="168" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="15" font-weight="700" fill="#2C1B12">只做渲染</text>
  <text x="1006" y="192" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" fill="#A08D7E">三档方案 + 淘汰理由</text>

  <!-- 禁区标注 -->
  <line x1="520" y1="250" x2="860" y2="250" stroke="#DA291C" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="690" y="274" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="13.5" font-weight="800" fill="#DA291C">↑ 模型在这段里没有权限</text>
  <text x="690" y="298" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="12" fill="#A08D7E">它算错一个价格、猜错一个热量，输出就会自相矛盾——所以干脆不让它算。</text>

  <!-- 图例 -->
  <text x="48" y="250" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#A08D7E">红虚线框 = 语言模型</text>
  <text x="48" y="272" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif" font-size="11.5" fill="#A08D7E">黄实线框 = 确定性代码</text>
</svg>
